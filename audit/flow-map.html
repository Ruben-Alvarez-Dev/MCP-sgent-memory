<style>

  .tab.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}

  .chip{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 10px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; cursor:pointer; transition:all .12s; color:var(--txt); font-size:12px;}

  .chip .fn{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; color:var(--code); font-weight:600;}
  .chip .loc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; color:var(--dim); margin-top:1px;}
  .chip .role{font-size:11.5px; color:#c9cdd9; margin-top:3px;}
  .chip .mixTag{display:inline-block; margin-left:6px; font-size:9px; padding:1px 6px; border-radius:8px; background:rgba(70,212,192,.15); color:var(--code); font-weight:700;}
  .chip .mixTag.hot{background:rgba(242,92,84,.15); color:var(--dead);}
  .mixBox{margin-top:8px; padding:9px 11px; border-radius:8px; background:rgba(70,212,192,.07); border-left:3px solid var(--code); font-size:12px; color:#c9cdd9;}

  .backBtn{margin-top:12px; padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--txt); cursor:pointer; font-size:12px;}

function stepTo(i){
  const f = flows[curFlow]; if (!f) return;
  curStep = Math.max(0, Math.min(i, f.steps.length-1));
  view = {type:"step"};
  const s = f.steps[curStep];
  clearCodeLit();
  for (const [id,el] of Object.entries(els)){
    el.classList.remove("lit","current");
    if (f.nodes.includes(id)) el.classList.add("lit");
  }
  els[s.n].classList.add("current");
  if (s.u) for (const nid of units[s.u].nodes) els[nid] && els[nid].classList.add("codeLit");
  els[s.n].scrollIntoView({block:"nearest", inline:"nearest", behavior:"smooth"});
  lbl.textContent = `${L(UI.step)} ${curStep+1} / ${f.steps.length}`;
  prevB.disabled = curStep===0; nextB.disabled = curStep===f.steps.length-1;
  const n = nodes[s.n];
  const isPerm = curFlow === "permeability";
  const u = s.u ? units[s.u] : null;
  document.getElementById("pTitle").innerHTML = `${L(UI.flowNames[curFlow])} <span class="badge ${badgeCls[n.st]}">${L(UI.badges[n.st])}</span>`;
  document.getElementById("pBody").innerHTML =
    `<div class="stepCard ${isPerm?'perm':''}"><div class="t">${L(s.t)}</div><div class="d">${L(s.d)}</div></div>` +
    (u ? `<h3>${L(UI.codeAtStep)}</h3>${chipsHtml([s.u], s.u)}
          ${u.mix ? `<div class="mixBox">${L(u.mix)}</div>` : ""}` : "") +
    `<h3>${L(UI.node)}: ${n.nm}</h3><p>${L(n.what)}</p>
     ${n.findings.length ? `<h3>${L(UI.findingsHere)}</h3>`+n.findings.map(([sv,t])=>`<div class="finding ${sv==='warn'?'warn':''}">${L(t)}</div>`).join("") : ""}
     <p class="hint">${L(UI.walkHint)}</p>`;
}
prevB.onclick = () => stepTo(curStep-1);
nextB.onclick = () => stepTo(curStep+1);
window.addEventListener("resize", drawEdges);
// ─── Language switch ─────────────────────────────────────────────────────────
function applyLangChrome(){
  document.documentElement.lang = lang;
  document.getElementById("hTitle").textContent = L(UI.title);
  document.getElementById("hSub").textContent = L(UI.sub);
  document.getElementById("lgOk").textContent = L(UI.lgOk);
  document.getElementById("lgWarn").textContent = L(UI.lgWarn);
  document.getElementById("lgDead").textContent = L(UI.lgDead);
  document.getElementById("lgInfo").textContent = L(UI.lgInfo);
  document.getElementById("lgCode").textContent = L(UI.lgCode);
  document.querySelectorAll(".tab").forEach(t => t.textContent = L(UI.tabs[t.dataset.flow]));
  prevB.textContent = L(UI.prev); nextB.textContent = L(UI.next);
  document.getElementById("btnEs").classList.toggle("on", lang==="es");
  document.getElementById("btnEn").classList.toggle("on", lang==="en");
}
window.setLang = function(l){
  if (l === lang) return;
  lang = l; localStorage.setItem("fm_lang", l);
  applyLangChrome(); renderNodeLabels(); drawEdges();
  // Re-render the current view in the new language without losing position.
  if (view.type === "step" && flows[curFlow]) stepTo(curStep);
  else if (view.type === "node") showNode(view.id);
  else if (view.type === "unit") showUnit(view.id);
  else showWelcome();
  if (flows[curFlow]) lbl.textContent = `${L(UI.step)} ${curStep+1} / ${flows[curFlow].steps.length}`;
  else lbl.textContent = "—";
};
// ─── Init ────────────────────────────────────────────────────────────────────
applyLangChrome();
showWelcome();
</script>
</body>
