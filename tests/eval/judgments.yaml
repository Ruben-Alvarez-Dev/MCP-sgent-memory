# judgments-40 — relevance judgments for eval-40 against the M3 fixture corpus.
#
# Basis: human-style judgments derived from the fixture manifest
# (tests/eval/fixture_corpus.py). "Relevant" = the docs an engineer would
# accept as an answer for that query in THIS repo, including honest mappings
# for dead symbols (AuthService, build_repo_index_points) — the retrieval
# miss on those is a system finding, not a judgment error.
#
# Judgments are independent of what the retrieval stack actually returns:
# recall can be low; that is the point of the eval.
version: 1
