name: CI

on:
  push:
    branches:
      - main
      - change/phase0-foundation
  pull_request:
    branches:
      - main
      - change/phase0-foundation

jobs:
  # Gate 1 (mandatory) + Gate 4 — plan §3.4 items 1 and 4.
  # No external services required: this job must always be green.
  core:
    name: Core tests (no services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Run core unit tests
        run: PYTHONPATH=src pytest tests/core -q

      - name: Install coverage tooling
        # pytest-cov is CI-only tooling, not a project dependency — kept out
        # of pyproject.toml's [dev] extras per the "no new deps without an
        # ADR" rule (CLAUDE.md).
        run: pip install pytest-cov

      - name: Coverage gate (fail under 60%)
        run: PYTHONPATH=src pytest tests/core -q --cov=shared --cov-report=term-missing --cov-fail-under=60

  # Gate 3 — plan §3.4 item 3.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check src tests

      - name: ruff format --check
        run: ruff format --check src tests

  # Gate 2 — plan §3.4 item 2.
  integration:
    name: Integration tests (Qdrant service)
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    env:
      # Wired now so Phase 2 can flip tests/app's skip-on-missing-services
      # logic into a hard failure with zero further CI changes (see TODO
      # below). No effect yet: tests/app/conftest.py does not read CI today.
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/healthz && exit 0
            sleep 1
          done
          echo "Qdrant did not become ready in time" >&2
          exit 1

      # TODO(Phase 2 — see docs/plan/IMPROVEMENT-PLAN.md §3.4 gate 2 and
      # docs/plan/SESSION-HANDOFF.md "tests/app silent-skip -> becomes
      # failure under CI=1 (Phase 1.4)"): tests/app/conftest.py currently
      # calls pytest.skip(..., allow_module_level=True) whenever Qdrant
      # (:6333) or the embedding server (:8081) are unreachable — it does
      # not check CI at all. This job provides a real Qdrant service
      # container, but there is no embedding-server container wired yet, so
      # tests/app will still silently skip here today. Do NOT change
      # conftest.py's skip behavior as part of this CI task — that is
      # explicit Phase 2 scope (add an embedding stub/service + make
      # conftest.py fail instead of skip when CI=1).
      - name: Run tests/app (services best-effort; still skips without an embedding server)
        run: PYTHONPATH=src pytest tests/app -q
